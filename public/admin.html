<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - StegoTransfer Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #00ffff;
      --accent-dim: #00cccc;
      --warning: #ffaa00;
      --danger: #ff3366;
      --success: #00ff88;
      --bg-dark: #0d0d1a;
      --bg-darker: #080812;
      --panel-bg: rgba(20, 25, 45, 0.8);
      --border: rgba(0, 255, 255, 0.25);
      --text: #e0e0ff;
      --text-dim: rgba(224, 224, 255, 0.6);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Exo 2', sans-serif;
      background: var(--bg-darker);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    /* Animated circuit background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px),
        radial-gradient(circle at 30% 40%, rgba(0, 255, 255, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(255, 170, 0, 0.05) 0%, transparent 40%);
      z-index: 0;
      pointer-events: none;
    }
    
    /* Login Screen */
    .login-screen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-darker);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      animation: fadeIn 0.5s;
    }
    
    .login-screen.hidden {
      display: none;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .login-box {
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 60px 50px;
      max-width: 450px;
      width: 90%;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 50px rgba(0, 255, 255, 0.2);
      animation: slideInUp 0.6s ease-out;
    }
    
    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .login-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 2rem;
      text-align: center;
      color: var(--accent);
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 4px;
    }
    
    .login-subtitle {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 40px;
      font-size: 0.95rem;
      letter-spacing: 2px;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 10px;
      color: var(--accent);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .form-input {
      width: 100%;
      padding: 15px 20px;
      background: rgba(13, 13, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      transition: all 0.3s;
      outline: none;
    }
    
    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
      background: rgba(13, 13, 26, 0.9);
    }
    
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
      border: none;
      border-radius: 4px;
      color: var(--bg-darker);
      font-family: 'Exo 2', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 255, 255, 0.4);
    }
    
    /* Main Dashboard */
    .dashboard {
      position: relative;
      z-index: 1;
      display: none;
      animation: fadeIn 0.5s;
    }
    
    .dashboard.visible {
      display: block;
    }
    
    /* Top Bar */
    .topbar {
      background: var(--panel-bg);
      border-bottom: 2px solid var(--border);
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .topbar-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.5rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .topbar-title::before {
      content: '';
      width: 12px;
      height: 12px;
      background: var(--success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { 
        opacity: 1;
        box-shadow: 0 0 10px var(--success);
      }
      50% { 
        opacity: 0.4;
        box-shadow: 0 0 20px var(--success);
      }
    }
    
    .topbar-actions {
      display: flex;
      gap: 20px;
      align-items: center;
    }
    
    .user-info {
      color: var(--text-dim);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }
    
    .btn-logout {
      padding: 10px 25px;
      background: transparent;
      border: 1px solid var(--danger);
      border-radius: 4px;
      color: var(--danger);
      font-family: 'Exo 2', sans-serif;
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }
    
    .btn-logout:hover {
      background: var(--danger);
      color: var(--bg-darker);
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
    }
    
    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px 40px;
      animation: slideDown 0.6s ease-out;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .stat-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 25px;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    
    .stat-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
      transform: translateY(-3px);
    }
    
    .stat-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    
    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent);
      font-family: 'Exo 2', sans-serif;
    }
    
    /* Data Table */
    .data-section {
      padding: 0 40px 40px;
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }
    
    .section-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.3rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .btn-refresh {
      padding: 10px 20px;
      background: transparent;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: var(--accent);
      font-family: 'Exo 2', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    
    .btn-refresh:hover {
      background: var(--accent);
      color: var(--bg-darker);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }
    
    .data-table {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    thead {
      background: rgba(0, 255, 255, 0.1);
    }
    
    th {
      padding: 18px 20px;
      text-align: left;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.85rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      border-bottom: 2px solid var(--border);
    }
    
    td {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(0, 255, 255, 0.1);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
    }
    
    tbody tr {
      transition: all 0.3s;
    }
    
    tbody tr:hover {
      background: rgba(0, 255, 255, 0.05);
    }
    
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .status-encrypted {
      background: rgba(0, 255, 255, 0.2);
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    
    .status-decrypted {
      background: rgba(0, 255, 136, 0.2);
      color: var(--success);
      border: 1px solid var(--success);
    }
    
    .action-btns {
      display: flex;
      gap: 10px;
    }
    
    .btn-action {
      padding: 6px 14px;
      border: none;
      border-radius: 3px;
      font-family: 'Exo 2', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .btn-decrypt {
      background: var(--accent);
      color: var(--bg-darker);
    }
    
    .btn-decrypt:hover {
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
      transform: translateY(-1px);
    }
    
    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
    }
    
    .btn-delete:hover {
      background: var(--danger);
      color: var(--bg-darker);
      box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      animation: fadeIn 0.3s;
    }
    
    .modal.show {
      display: flex;
    }
    
    .modal-content {
      background: var(--panel-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 40px;
      max-width: 700px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      backdrop-filter: blur(10px);
      animation: modalSlideIn 0.4s ease-out;
    }
    
    @keyframes modalSlideIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .modal-title {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.4rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    .btn-close {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.3s;
      line-height: 1;
    }
    
    .btn-close:hover {
      color: var(--danger);
      transform: rotate(90deg);
    }
    
    .decrypted-content {
      background: rgba(13, 13, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
      color: var(--success);
    }
    
    .metadata {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid var(--border);
    }
    
    .metadata-item {
      margin-bottom: 15px;
      display: flex;
      gap: 15px;
    }
    
    .metadata-label {
      font-family: 'Share Tech Mono', monospace;
      color: var(--accent);
      min-width: 120px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    
    .metadata-value {
      font-family: 'Share Tech Mono', monospace;
      color: var(--text-dim);
      flex: 1;
      font-size: 0.85rem;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
    
    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.3;
    }
    
    .empty-state-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    /* Loading */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(8, 8, 18, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 5000;
      backdrop-filter: blur(5px);
    }
    
    .loading-overlay.show {
      display: flex;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(0, 255, 255, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @media (max-width: 768px) {
      .topbar {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
      }
      
      .stats-bar {
        padding: 20px;
        grid-template-columns: 1fr;
      }
      
      .data-section {
        padding: 0 20px 20px;
      }
      
      .data-table {
        overflow-x: auto;
      }
      
      table {
        min-width: 800px;
      }
      
      .modal-content {
        padding: 25px;
      }
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div class="login-title">Command Center</div>
      <div class="login-subtitle">Authentication Required</div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-input" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-login">Access System</button>
      </form>
    </div>
  </div>
  
  <!-- Dashboard -->
  <div id="dashboard" class="dashboard">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-title">
        StegoTransfer Admin
      </div>
      <div class="topbar-actions">
        <div class="user-info">User: <span id="currentUser">—</span></div>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </div>
    
    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Transmissions</div>
        <div class="stat-value" id="statTotal">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Unique Sources</div>
        <div class="stat-value" id="statSources">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Last Received</div>
        <div class="stat-value" id="statLast" style="font-size: 1.2rem;">—</div>
      </div>
    </div>
    
    <!-- Data Table -->
    <div class="data-section">
      <div class="section-header">
        <div class="section-title">Intercepted Transmissions</div>
        <button class="btn-refresh" onclick="loadData()">↻ Refresh</button>
      </div>
      
      <div class="data-table">
        <table>
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Source IP</th>
              <th>Target</th>
              <th>Algorithm</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <!-- Data rows will be inserted here -->
          </tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-state-icon">📡</div>
          <div class="empty-state-text">No transmissions received yet</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Decryption Modal -->
  <div id="decryptModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Decrypted Content</div>
        <button class="btn-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="decrypted-content" id="decryptedContent"></div>
      <div class="metadata" id="metadataSection"></div>
    </div>
  </div>
  
  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-spinner"></div>
  </div>
  
  <script>
    let currentData = [];
    
    // Check authentication on load
    async function checkAuth() {
      try {
        const response = await fetch('/api/admin/status');
        const data = await response.json();
        
        if (data.authenticated) {
          showDashboard(data.username);
        }
      } catch (err) {
        console.error('Auth check failed:', err);
      }
    }
    
    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      showLoading();
      
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showDashboard(username);
        } else {
          alert('Invalid credentials');
        }
      } catch (err) {
        console.error('Login error:', err);
        alert('Login failed');
      } finally {
        hideLoading();
      }
    });
    
    // Logout
    async function logout() {
      try {
        await fetch('/api/admin/logout', { method: 'POST' });
        location.reload();
      } catch (err) {
        console.error('Logout error:', err);
      }
    }
    
    // Show dashboard
    function showDashboard(username) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('dashboard').classList.add('visible');
      document.getElementById('currentUser').textContent = username;
      loadData();
    }
    
    // Load data
    async function loadData() {
      showLoading();
      
      try {
        const response = await fetch('/api/admin/data');
        const result = await response.json();
        
        currentData = result.data || [];
        updateStats();
        renderTable();
      } catch (err) {
        console.error('Failed to load data:', err);
      } finally {
        hideLoading();
      }
    }
    
    // Update statistics
    function updateStats() {
      document.getElementById('statTotal').textContent = currentData.length;
      
      const uniqueSources = new Set(currentData.map(d => d.source)).size;
      document.getElementById('statSources').textContent = uniqueSources;
      
      if (currentData.length > 0) {
        const lastTime = new Date(currentData[0].timestamp);
        const now = new Date();
        const diff = Math.floor((now - lastTime) / 60000); // minutes
        
        let timeStr;
        if (diff < 1) timeStr = 'Just now';
        else if (diff < 60) timeStr = `${diff}m ago`;
        else if (diff < 1440) timeStr = `${Math.floor(diff / 60)}h ago`;
        else timeStr = `${Math.floor(diff / 1440)}d ago`;
        
        document.getElementById('statLast').textContent = timeStr;
      }
    }
    
    // Render table
    function renderTable() {
      const tbody = document.getElementById('dataTableBody');
      const emptyState = document.getElementById('emptyState');
      
      if (currentData.length === 0) {
        tbody.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      
      tbody.innerHTML = currentData.map(item => `
        <tr>
          <td>${new Date(item.timestamp).toLocaleString()}</td>
          <td>${item.source}</td>
          <td>${item.target}</td>
          <td>${item.metadata.algorithm || 'N/A'}</td>
          <td>
            <span class="status-badge status-encrypted">Encrypted</span>
          </td>
          <td>
            <div class="action-btns">
              <button class="btn-action btn-decrypt" onclick="decryptItem('${item.id}')">
                Decrypt
              </button>
              <button class="btn-action btn-delete" onclick="deleteItem('${item.id}')">
                Delete
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }
    
    // Decrypt item
    async function decryptItem(id) {
      showLoading();
      
      try {
        const response = await fetch(`/api/admin/decrypt/${id}`, { method: 'POST' });
        const result = await response.json();
        
        if (result.success) {
          showDecryptModal(result);
        } else {
          alert('Failed to decrypt: ' + result.error);
        }
      } catch (err) {
        console.error('Decryption error:', err);
        alert('Decryption failed');
      } finally {
        hideLoading();
      }
    }
    
    // Show decrypt modal
    function showDecryptModal(result) {
      const content = document.getElementById('decryptedContent');
      const metadata = document.getElementById('metadataSection');
      
      if (result.decrypted.type === 'text') {
        content.textContent = result.decrypted.content;
      } else {
        content.textContent = `[Binary Data - ${result.decrypted.size} bytes]\n\nBase64:\n${result.decrypted.content}`;
      }
      
      metadata.innerHTML = `
        <div class="metadata-item">
          <div class="metadata-label">Source:</div>
          <div class="metadata-value">${result.metadata.source}</div>
        </div>
        <div class="metadata-item">
          <div class="metadata-label">Target:</div>
          <div class="metadata-value">${result.metadata.target}</div>
        </div>
        <div class="metadata-item">
          <div class="metadata-label">Algorithm:</div>
          <div class="metadata-value">${result.metadata.metadata.algorithm}</div>
        </div>
        <div class="metadata-item">
          <div class="metadata-label">Timestamp:</div>
          <div class="metadata-value">${new Date(result.metadata.timestamp).toLocaleString()}</div>
        </div>
      `;
      
      document.getElementById('decryptModal').classList.add('show');
    }
    
    // Close modal
    function closeModal() {
      document.getElementById('decryptModal').classList.remove('show');
    }
    
    // Delete item
    async function deleteItem(id) {
      if (!confirm('Are you sure you want to delete this transmission?')) return;
      
      showLoading();
      
      try {
        const response = await fetch(`/api/admin/data/${id}`, { method: 'DELETE' });
        const result = await response.json();
        
        if (result.success) {
          loadData();
        } else {
          alert('Failed to delete');
        }
      } catch (err) {
        console.error('Delete error:', err);
        alert('Delete failed');
      } finally {
        hideLoading();
      }
    }
    
    // Loading helpers
    function showLoading() {
      document.getElementById('loadingOverlay').classList.add('show');
    }
    
    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('show');
    }
    
    // Initialize
    checkAuth();
  </script>
</body>
</html>
